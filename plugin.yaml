manifest_version: 2
api_version: 1
name: omni-fabric-runtime
version: "0.3.0"
kind: standalone
description: "Environment-adaptive agent fabric runtime: SQLite WAL monotonic lease queue, affinity bundle dispatch, enriched trace envelopes, distinct maker!=checker object cache with FTS5 RRF search, attenuation-gated Macro-DAG compiler, NodeGrid + RL canary optimizer, LoRA-XS 256B subspace cartridges with thinking=off baseline gating, and OpenAI-v1 loopback swarm proxy."
author: "aidonerightcorp"
license: "MIT"
homepage: "https://github.com/aidonerightcorp/omni-fabric-runtime"
requires_hermes: ">=0.20.0"
requires_env: []
python_dependencies: []
provides_tools:
  - fabric_probe_and_configure
  - fabric_task_queue
  - fabric_claim_bundle
  - fabric_object_store
  - fabric_compile_workflow_dag
  - fabric_grid_and_rl_optimize
  - fabric_boil_down_and_edit
  - fabric_swarm_proxy_control
  - fabric_federated_sync
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_verify
  - post_api_request
  - post_tool_call
  - subagent_start
  - subagent_stop
  - kanban_task_claimed
  - kanban_task_completed
  - on_kanban_worker_stale_claim
provides_middleware:
  - llm_request
config_schema:
  setup_profile:
    type: string
    default: "auto"
    description: "Environment profile (auto, stdlib_airgap, local_neural, local_runner_swarm, hybrid_fabric_sync, thin_remote_client)."
  regime:
    type: string
    default: "balanced_adaptive"
    description: "Active NodeGrid regime cell (interactive_low_latency, balanced_adaptive, deep_swarm_campaign)."
  bundle_cardinality_k:
    type: integer
    default: 3
    description: "Default number of ready tasks (1..4) claimed atomically per worker bundle."
  dispatch_affinity_mode:
    type: string
    default: "back_to_back_sequential"
    description: "Worker bundle scheduling mode (single_isolated, back_to_back_sequential, simultaneous_batched_pack, speculative_pipeline)."
  attenuation_circuit_breaker_milli:
    type: integer
    default: 650
    description: "Cumulative survival floor in milli-units below which downstream DAG tasks pause until an independent checker resets attenuation."
  lora_xs_subspace_rank:
    type: integer
    default: 8
    description: "Singular subspace rank r for LoRA-XS r x r float32 weight cartridges (r=8 yields 256-byte cartridges)."
  require_thinking_off_baseline_gate:
    type: boolean
    default: true
    description: "Require candidate weight operators and LoRA-XS cartridges to beat both verbose and matched thinking=off baselines across seeds."
  local_runner_url:
    type: string
    default: "http://127.0.0.1:11434"
    description: "Optional loopback open-model runner base URL probed when local runner mode is active."
  upstream_endpoint:
    type: string
    default: ""
    description: "Optional remote Fabric base URL for hybrid_fabric_sync or thin_remote_client setups (blank keeps runtime local-only)."
  default_visibility:
    type: string
    default: "local_only"
    description: "Default visibility for staged Task Objects (local_only or sync_ready)."
  enable_pre_verify_gate:
    type: boolean
    default: true
    description: "Nudge turn completion when leased tasks edited workspace files without a fenced checkpoint."
tags:
  - durable-execution
  - lease-fencing
  - bundle-dispatch
  - grid-optimization
  - reinforcement-learning
  - multi-agent-swarm
  - neural-distillation
