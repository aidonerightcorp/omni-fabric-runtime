manifest_version: 2
api_version: 1
name: omni-fabric-runtime
version: "0.6.0"
kind: standalone
description: "Environment-adaptive agent fabric runtime: SQLite WAL monotonic lease queue, affinity bundle dispatch, enriched trace envelopes, distinct maker!=checker object cache with FTS5 RRF search, 6-stage weight-space compiler across 6 model classes, Actor x {Transfer, Transform, Save} x Horizon check-gated DAG decomposer, leak-free holdout recursive RL trial engine, topic-nullspace generator attribution, zero-token Koopman + CEGAR trajectory planner, 7-target portable cartridge & in-memory IEEE-754 WASM/WebGPU WGSL compiler, (epsilon, delta)-DP Nullspace Woodbury federated merge, and DNS-pinned OpenAI-v1 loopback swarm proxy."
author: "aidonerightcorp"
license: "MIT"
homepage: "https://github.com/aidonerightcorp/omni-fabric-runtime"
requires_hermes: ">=0.20.0"
requires_env: []
python_dependencies: []
provides_tools:
  - fabric_probe_and_configure
  - fabric_task_queue
  - fabric_claim_bundle
  - fabric_object_store
  - fabric_compile_workflow_dag
  - fabric_grid_and_rl_optimize
  - fabric_boil_down_and_edit
  - fabric_swarm_proxy_control
  - fabric_federated_sync
  - fabric_compile_weight_unit
  - fabric_decompose_horizon
  - fabric_recursive_trial
  - fabric_attribute_generator_profile
  - fabric_plan_koopman_trajectory
  - fabric_export_portable_cartridge
  - fabric_compile_wasm_wgsl_kernel
  - fabric_dp_federated_merge
provides_hooks:
  - on_session_start
  - pre_llm_call
  - pre_verify
  - post_api_request
  - post_tool_call
  - subagent_start
  - subagent_stop
  - kanban_task_claimed
  - kanban_task_completed
  - on_kanban_worker_stale_claim
provides_middleware:
  - llm_request
config_schema:
  setup_profile:
    type: string
    default: "auto"
    description: "Environment profile (auto, stdlib_airgap, local_neural, local_runner_swarm, hybrid_fabric_sync, thin_remote_client)."
  regime:
    type: string
    default: "balanced_adaptive"
    description: "Active NodeGrid regime cell (interactive_low_latency, balanced_adaptive, deep_swarm_campaign)."
  bundle_cardinality_k:
    type: integer
    default: 3
    description: "Default number of ready tasks (1..4) claimed atomically per worker bundle."
  dispatch_affinity_mode:
    type: string
    default: "back_to_back_sequential"
    description: "Worker bundle scheduling mode (single_isolated, back_to_back_sequential, simultaneous_batched_pack, speculative_pipeline)."
  attenuation_circuit_breaker_milli:
    type: integer
    default: 650
    description: "Cumulative survival floor in milli-units below which downstream DAG tasks pause until an independent checker resets attenuation."
  lora_xs_subspace_rank:
    type: integer
    default: 8
    description: "Singular subspace rank r for LoRA-XS r x r float32 weight cartridges (r=8 yields 256-byte cartridges)."
  require_thinking_off_baseline_gate:
    type: boolean
    default: true
    description: "Require candidate weight operators and LoRA-XS cartridges to beat both verbose and matched thinking=off baselines across seeds."
  horizon_max_steps:
    type: integer
    default: 48
    description: "Maximum atomic horizon steps compiled per check-gated Actor x {Transfer, Transform, Save} workflow."
  checkpoint_cadence_steps:
    type: integer
    default: 3
    description: "Step cadence at which disjoint maker!=checker save boundaries reset cumulative survival."
  local_runner_url:
    type: string
    default: "http://127.0.0.1:11434"
    description: "Optional loopback open-model runner base URL (127.0.0.1 or ::1 only) used when allow_local_runner is enabled."
  allow_local_runner:
    type: boolean
    default: false
    description: "Explicitly permit loopback HTTP calls (127.0.0.1 or ::1 only) to owner-configured local_runner_url."
  upstream_endpoint:
    type: string
    default: ""
    description: "Optional owner-configured remote Fabric base URL for hybrid_fabric_sync or thin_remote_client setups (blank keeps runtime local-only)."
  allow_local_upstream:
    type: boolean
    default: false
    description: "Explicitly permit loopback or private RFC1918/ULA addresses for owner-configured upstream_endpoint."
  default_visibility:
    type: string
    default: "local_only"
    description: "Default visibility for staged Task Objects (local_only or sync_ready)."
  enable_pre_verify_gate:
    type: boolean
    default: true
    description: "Nudge turn completion when leased tasks edited workspace files without a fenced checkpoint."
tags:
  - durable-execution
  - lease-fencing
  - bundle-dispatch
  - weight-space-programming
  - horizon-decomposition
  - grid-optimization
  - reinforcement-learning
  - multi-agent-swarm
